[project]
name = "atlasrisk-risk-engine"
version = "0.1.0"
description = "Deterministic numerical risk engine for AtlasRisk."
readme = "README.md"
requires-python = ">=3.14,<3.15"
[project.optional-dependencies]
analytics = [
    "numpy==2.3.2",
    "pandas==2.3.3",
    "pydantic==2.12.5",
    "scipy==1.16.1",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "pytest-cov==6.2.1",
    "ruff==0.12.10",
]

[project.scripts]
atlasrisk-risk-engine = "atlasrisk:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlasrisk"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv]
default-groups = ["dev"]
