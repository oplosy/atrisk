version: "3"

tasks:
  format:
    desc: Check Go, Python, and web formatting without changing files
    cmds:
      - task: format-go
      - task: format-python
      - npm run format:check

  format-go:
    cmds:
      - node scripts/verify/check-go-format.mjs

  format-python:
    dir: risk-engine
    cmds:
      - uv run --locked ruff format --check src tests

  lint:
    desc: Run Go, Python, and web linters
    cmds:
      - go vet ./apps/... ./internal/...
      - task: lint-python
      - npm run lint

  lint-python:
    dir: risk-engine
    cmds:
      - uv run --locked ruff check src tests

  typecheck:
    desc: Compile Go packages and typecheck the web application
    cmds:
      - go test -run '^$' ./apps/... ./internal/...
      - npm run typecheck

  unit:
    desc: Run Go, Python, and web unit tests
    cmds:
      - node --test scripts/verify/check-generated.test.mjs scripts/verify/check-scope.test.mjs
      - go test ./apps/... ./internal/...
      - task: unit-python
      - npm test -- --run

  unit-python:
    dir: risk-engine
    cmds:
      - uv run --locked pytest

  test-contract:
    desc: Run contract tests when contract sources exist
    cmds:
      - node scripts/verify/check-scope.mjs contract contracts test/contract

  test-integration:
    desc: Run integration tests when integration sources exist
    cmds:
      - node scripts/verify/check-scope.mjs integration test/integration

  build:
    desc: Build Go, Python, and web artifacts
    cmds:
      - go build ./apps/...
      - uv build --project risk-engine
      - npm run build

  check-generated:
    desc: Fail when generated paths have uncommitted drift
    cmds:
      - node scripts/verify/check-generated.mjs

  verify:
    desc: Run the complete deterministic local verification gate
    cmds:
      - task: format
      - task: lint
      - task: typecheck
      - task: unit
      - task: test-contract
      - task: test-integration
      - task: build
      - task: check-generated

  infra-start:
    desc: Start local PostgreSQL and Garage and wait for health
    cmds:
      - node scripts/infra/infra.mjs start

  infra-stop:
    desc: Stop local infrastructure without deleting volumes
    cmds:
      - node scripts/infra/infra.mjs stop

  infra-status:
    desc: Show local infrastructure container status
    cmds:
      - node scripts/infra/infra.mjs status

  infra-logs:
    desc: Show the last 100 lines of local infrastructure logs
    cmds:
      - node scripts/infra/infra.mjs logs

  infra-reset:
    desc: DESTRUCTIVE reset of local infrastructure containers and volumes
    cmds:
      - node scripts/infra/infra.mjs reset --confirm-reset

  test-infra:
    desc: Run isolated PostgreSQL and Garage integration smoke tests
    cmds:
      - node --test scripts/infra/infra.test.mjs
      - node scripts/infra/infra.mjs test
