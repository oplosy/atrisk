name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ATLASRISK_TEST_DATABASE_URL: postgres://atrisk_ci:atrisk_ci_password@127.0.0.1:5432/atrisk_test?sslmode=disable
      ATLASRISK_REQUIRE_TEST_DATABASE: "1"
      ATLASRISK_S3_ENDPOINT: http://127.0.0.1:53900
      ATLASRISK_S3_REGION: garage
      ATLASRISK_S3_BUCKET: atrisk-ci-raw
      AWS_ACCESS_KEY_ID: GKatrisktest
      AWS_SECRET_ACCESS_KEY: atlasrisk-garage-test-only-secret
      AWS_DEFAULT_REGION: garage
      AWS_EC2_METADATA_DISABLED: "true"
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_DB: atrisk_test
          POSTGRES_USER: atrisk_ci
          POSTGRES_PASSWORD: atrisk_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atrisk_ci -d atrisk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Start ephemeral Garage
        shell: bash
        run: |
          set -euo pipefail
          garage_dir="$RUNNER_TEMP/atlasrisk-garage"
          mkdir -p "$garage_dir/meta" "$garage_dir/data"
          rpc_secret="$(openssl rand -hex 32)"
          cat > "$garage_dir/garage.toml" <<EOF
          metadata_dir = "/var/lib/garage/meta"
          data_dir = "/var/lib/garage/data"
          db_engine = "sqlite"
          replication_factor = 1
          compression_level = 2
          rpc_bind_addr = "0.0.0.0:3901"
          rpc_public_addr = "127.0.0.1:3901"
          rpc_secret = "$rpc_secret"

          [s3_api]
          s3_region = "garage"
          api_bind_addr = "0.0.0.0:3900"
          root_domain = ".s3.localhost"
          EOF
          docker run --detach --name atrisk-ci-garage \
            --publish 127.0.0.1:53900:3900 \
            --volume "$garage_dir/garage.toml:/etc/garage.toml:ro" \
            --volume "$garage_dir/meta:/var/lib/garage/meta" \
            --volume "$garage_dir/data:/var/lib/garage/data" \
            --env GARAGE_DEFAULT_ACCESS_KEY="$AWS_ACCESS_KEY_ID" \
            --env GARAGE_DEFAULT_SECRET_KEY="$AWS_SECRET_ACCESS_KEY" \
            --env GARAGE_DEFAULT_BUCKET="$ATLASRISK_S3_BUCKET" \
            dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020 \
            /garage server --single-node --default-bucket --default-access-key
          for attempt in {1..30}; do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:53900/ || true)"
            if [ "$code" != "000" ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs atrisk-ci-garage
          exit 1

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version-file: risk-engine/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.8"
          enable-cache: true
          cache-dependency-glob: risk-engine/uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: apps/web/.node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Python dependencies from lockfile
        run: uv sync --project risk-engine --locked

      - name: Install web dependencies from lockfile
        run: npm ci

      - name: Install Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.44.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run raw archive integration
        run: task test-go-integration TEST=RawArchive

      - name: Run point-in-time API integration
        run: task test-go-integration TEST=PointInTimeAPI

      - name: Run data quality API integration
        run: task test-go-integration TEST=QualityAPI

      - name: Run portfolio API integration
        run: task test-go-integration TEST=PortfolioAPI

      - name: Run verification gate
        run: task verify

      - name: Stop ephemeral Garage
        if: always()
        shell: bash
        run: docker rm --force atrisk-ci-garage 2>/dev/null || true

      - name: Capture failure diagnostics
        if: failure()
        run: |
          mkdir -p .task/ci-failure
          git status --short > .task/ci-failure/status.txt
          git diff --check > .task/ci-failure/diff-check.txt 2>&1 || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-failure-diagnostics
          path: .task/ci-failure
          if-no-files-found: ignore
