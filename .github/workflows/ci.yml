name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ATLASRISK_TEST_DATABASE_URL: postgres://atrisk_ci:atrisk_ci_password@127.0.0.1:5432/atrisk_test?sslmode=disable
      PG_DSN: postgres://atrisk_ci:atrisk_ci_password@127.0.0.1:5432/atrisk_test?sslmode=disable
      SOURCE_PG_DSN: postgres://atrisk_ci:atrisk_ci_password@127.0.0.1:5432/atrisk_test?sslmode=disable
      ATLASRISK_ADMIN_DSN: postgres://atrisk_ci:atrisk_ci_password@127.0.0.1:5432/postgres?sslmode=disable
      RESTORE_PG_DSN: postgres://atrisk_ci:atrisk_ci_password@127.0.0.1:5432/atrisk_restore?sslmode=disable
      RESTORE_S3_ENDPOINT: http://127.0.0.1:53900
      RESTORE_S3_REGION: garage
      SOURCE_DATABASE_NAME: atrisk_test
      RESTORE_DATABASE_NAME: atrisk_restore
      ATLASRISK_RESTORE_TARGET: isolated
      ATLASRISK_POSTGRES_MAJOR: "18"
      ATLASRISK_REQUIRE_TEST_DATABASE: "1"
      ATLASRISK_S3_ENDPOINT: http://127.0.0.1:53900
      ATLASRISK_S3_REGION: garage
      ATLASRISK_S3_BUCKET: atrisk-ci-raw
      AWS_ACCESS_KEY_ID: GKatrisktest
      AWS_SECRET_ACCESS_KEY: atlasrisk-garage-test-only-secret
      AWS_DEFAULT_REGION: garage
      AWS_EC2_METADATA_DISABLED: "true"
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_DB: atrisk_test
          POSTGRES_USER: atrisk_ci
          POSTGRES_PASSWORD: atrisk_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atrisk_ci -d atrisk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Start ephemeral Garage
        shell: bash
        run: |
          set -euo pipefail
          garage_dir="$RUNNER_TEMP/atlasrisk-garage"
          mkdir -p "$garage_dir/meta" "$garage_dir/data"
          rpc_secret="$(openssl rand -hex 32)"
          cat > "$garage_dir/garage.toml" <<EOF
          metadata_dir = "/var/lib/garage/meta"
          data_dir = "/var/lib/garage/data"
          db_engine = "sqlite"
          replication_factor = 1
          compression_level = 2
          rpc_bind_addr = "0.0.0.0:3901"
          rpc_public_addr = "127.0.0.1:3901"
          rpc_secret = "$rpc_secret"

          [s3_api]
          s3_region = "garage"
          api_bind_addr = "0.0.0.0:3900"
          root_domain = ".s3.localhost"
          EOF
          docker run --detach --name atrisk-ci-garage \
            --publish 127.0.0.1:53900:3900 \
            --volume "$garage_dir/garage.toml:/etc/garage.toml:ro" \
            --volume "$garage_dir/meta:/var/lib/garage/meta" \
            --volume "$garage_dir/data:/var/lib/garage/data" \
            --env GARAGE_DEFAULT_ACCESS_KEY="$AWS_ACCESS_KEY_ID" \
            --env GARAGE_DEFAULT_SECRET_KEY="$AWS_SECRET_ACCESS_KEY" \
            --env GARAGE_DEFAULT_BUCKET="$ATLASRISK_S3_BUCKET" \
            dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020 \
            /garage server --single-node --default-bucket --default-access-key
          for attempt in {1..30}; do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:53900/ || true)"
            if [ "$code" != "000" ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs atrisk-ci-garage
          exit 1

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version-file: risk-engine/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.8"
          enable-cache: true
          cache-dependency-glob: risk-engine/uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: apps/web/.node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes ca-certificates curl gnupg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Install Python dependencies from lockfile
        run: uv sync --project risk-engine --locked

      - name: Install web dependencies from lockfile
        run: npm ci

      - name: Install Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.44.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install release scan tools
        run: |
          python -m pip install --disable-pip-version-check "pip-audit==2.10.1"
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          go install github.com/zricethezav/gitleaks/v8@v8.28.0
          aws --version

      - name: Run complete end-to-end journey
        id: e2e
        run: |
          set -o pipefail
          mkdir -p .task/ci-failure
          task test-e2e 2>&1 | tee .task/ci-failure/e2e.log

      - name: Run isolated backup and restore drill
        id: restore
        env:
          BACKUP_DIR: ${{ runner.temp }}/atlasrisk-ar602-backup
          RESTORE_S3_BUCKET: atrisk-ci-restore
        run: task test-backup-restore

      - name: Run migration-from-previous verification
        id: migration
        run: task test-migration

      - name: Run secret and dependency scan
        id: scan
        run: task security-scan

      - name: Generate SBOM
        id: sbom
        run: |
          mkdir -p .task/release
          docker run --rm --volume "$PWD:/src:ro" anchore/syft:v1.33.0@sha256:f94e5d9fce1f2278491a8e3a63bd5f6ddb81fdfdbb8bf7a1637565c1d5344357 \
            dir:/src --output cyclonedx-json > .task/release/atlasrisk-sbom.json
          test -s .task/release/atlasrisk-sbom.json
          ATLASRISK_SBOM_PREBUILT=1 task sbom

      - name: Upload release SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlasrisk-sbom
          path: .task/release/atlasrisk-sbom.json
          if-no-files-found: error

      - name: Run raw archive integration
        run: task test-go-integration TEST=RawArchive

      - name: Run point-in-time API integration
        run: task test-go-integration TEST=PointInTimeAPI

      - name: Run data quality API integration
        run: task test-go-integration TEST=QualityAPI

      - name: Run portfolio API integration
        run: task test-go-integration TEST=PortfolioAPI

      - name: Run manual CSV import integration
        run: task test-go-integration TEST=ImportAPI

      - name: Run valuation integration
        run: task test-go-integration TEST=ValuationAPI

      - name: Run database migration verification
        run: task migrate-test

      - name: Run verification gate
        id: verify
        run: task verify

      - name: Run release readiness gate
        env:
          ATLASRISK_GATE_CI: ${{ steps.verify.outcome == 'success' && 'passed' || steps.verify.outcome }}
          ATLASRISK_GATE_E2E: ${{ steps.e2e.outcome == 'success' && 'passed' || steps.e2e.outcome }}
          ATLASRISK_GATE_SCAN: ${{ steps.scan.outcome == 'success' && 'passed' || steps.scan.outcome }}
          ATLASRISK_GATE_MIGRATION: ${{ steps.migration.outcome == 'success' && 'passed' || steps.migration.outcome }}
          ATLASRISK_GATE_RESTORE: ${{ steps.restore.outcome == 'success' && 'passed' || steps.restore.outcome }}
          ATLASRISK_GATE_SBOM: ${{ steps.sbom.outcome == 'success' && 'passed' || steps.sbom.outcome }}
        run: task release-gate

      - name: Stop ephemeral Garage
        if: always()
        shell: bash
        run: docker rm --force atrisk-ci-garage 2>/dev/null || true

      - name: Capture failure diagnostics
        if: failure()
        run: |
          mkdir -p .task/ci-failure
          git status --short > .task/ci-failure/status.txt
          git diff --check > .task/ci-failure/diff-check.txt 2>&1 || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-failure-diagnostics
          path: .task/ci-failure
          if-no-files-found: ignore

  images:
    name: Images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      API_IMAGE: atrisk-api:ci
      WORKER_IMAGE: atrisk-risk-worker:ci
      COLLECTOR_IMAGE: atrisk-collector:ci
      ATLASRISK_DATABASE_URL: postgres://atrisk:atrisk-images-ci-only@127.0.0.1:5432/atrisk?sslmode=disable
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_DB: atrisk
          POSTGRES_USER: atrisk
          POSTGRES_PASSWORD: atrisk-images-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atrisk -d atrisk"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build release images
        run: |
          docker build --file infra/images/api.Dockerfile --build-arg VERSION=ci --tag "$API_IMAGE" .
          docker build --file infra/images/risk-worker.Dockerfile --build-arg VERSION=ci --tag "$WORKER_IMAGE" .
          docker build --file infra/images/collector.Dockerfile --build-arg VERSION=ci --tag "$COLLECTOR_IMAGE" .

      - name: Smoke-test release images
        run: bash scripts/release/smoke-images.sh
