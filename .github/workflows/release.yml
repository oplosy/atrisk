name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Require the tag to be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG does not point to a commit on main"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: apps/web/.node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build web bundle
        run: |
          npm ci
          npm run build
          bundle="atlasrisk-web-$TAG.tar.gz"
          tar --create --gzip --file "$bundle" --directory apps/web/dist .
          sha256sum "$bundle" > "$bundle.sha256"

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and push images
        run: REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" bash scripts/release/publish-images.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Images (pin these digests in the deployment):"
            echo
            sed 's/^/    /' images.txt
            echo
            echo "Web bundle: atlasrisk-web-$TAG.tar.gz"
            echo
            echo "    $(cut -d' ' -f1 "atlasrisk-web-$TAG.tar.gz.sha256")"
          } > release-notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md \
            "atlasrisk-web-$TAG.tar.gz" "atlasrisk-web-$TAG.tar.gz.sha256" images.txt

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
