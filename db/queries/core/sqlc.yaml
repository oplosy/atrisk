version: "2"
sql:
  - engine: postgresql
    schema: "../../../db/migrations"
    queries: "."
    gen:
      go:
        package: database
        out: "../../../internal/platform/database"
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        emit_interface: true
        emit_pointers_for_null_types: true
